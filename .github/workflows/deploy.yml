name: Build and Deploy to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          DEPLOY_TARGET: ionos

      - name: Deploy via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASSWORD }}
          localDir: './dist'
          remoteDir: '.'
          options: '--verbose'

      - name: Wait for deployment propagation
        run: node scripts/wait-for-live.mjs https://teleschmie.de

      - name: Post-Deploy Link-Check
        run: |
          for i in {1..3}; do
            node scripts/check-links.mjs && break || {
              if [ $i -lt 3 ]; then
                echo "Link check failed. Retrying in 30s ($i/3)..."
                sleep 30
              else
                echo "Link check failed after 3 attempts."
                exit 1
              fi
            }
          done
        env:
          SITE_URL: https://teleschmie.de
