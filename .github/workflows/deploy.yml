name: Build and Deploy to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('**/package-lock.json', '**/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Install dependencies
        run: npm ci

      - name: Generate Astro types
        run: npx astro sync

      # - name: Lint content and code
      #   run: npm run lint

      - name: Build and Verify website
        run: npm run build:verify
        env:
          DEPLOY_TARGET: ionos

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to IONOS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Deploy via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASSWORD }}
          localDir: './dist'
          remoteDir: '.'
          options: '--verbose --parallel=2 --delete'

  verify:
    name: Verify Live Site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          # No npm cache/install needed here as scripts are standalone

      - name: Download build ID
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist-verify

      - name: Wait for deployment propagation
        run: |
          # Copy only build.txt to dist where expected by script
          mkdir -p dist
          cp dist-verify/build.txt dist/build.txt
          node scripts/wait-for-live.mjs https://teleschmie.de

      - name: Post-Deploy Link-Check (Robust Retries)
        run: |
          for i in {1..5}; do
            node scripts/check-links.mjs && break || {
              if [ $i -lt 5 ]; then
                echo "Link check failed. Retrying in 60s ($i/5)..."
                sleep 60
              else
                echo "Link check failed after 5 attempts."
                exit 1
              fi
            }
          done
        env:
          SITE_URL: https://teleschmie.de
