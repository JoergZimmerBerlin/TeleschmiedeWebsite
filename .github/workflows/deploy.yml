# IONOS DEPLOYMENT STANDARD (See .agent/ionos-standard.md for reference)
name: Build and Deploy to IONOS
on:
  push:
    branches:
      - main

# Concurrency Control: Prevents parallel SFTP collisions by queuing (not cancelling) incoming runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Astro
        run: npm run build
        env:
          DEPLOY_TARGET: ionos

      - name: Verify Build Artifacts
        run: |
          ls -la dist/.htaccess
          ls -la dist/build.txt

      - name: Prepare Hidden Files for IONOS
        run: |
          if [ -d "dist/.well-known" ]; then
            mv dist/.well-known dist/well-known-export
            echo ".well-known renamed to well-known-export for SFTP transport"
          fi

      - name: Deploy via SFTP (Lftp Mirror with Chmod)
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASSWORD }}
          localDir: './dist'
          remoteDir: '.'
          options: '--verbose --parallel=4 --delete --exclude videos/'

      - name: Trigger IONOS .htaccess Activation
        run: |
          sleep 5
          curl -s "https://teleschmie.de/activate_htaccess.php?token=teleschmiede_deploy_2026"
          echo "Activation script called."

      - name: Final Verification
        run: echo "Deployment complete for Build $(cat dist/build.txt)"
