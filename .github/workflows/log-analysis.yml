name: Daily Log Analysis

on:
  schedule:
    - cron: '0 16 * * *' # Täglich um 18:00 Uhr (16:00 UTC)
  workflow_dispatch: # Manuelles Auslösen

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Logs from IONOS
        timeout-minutes: 5
        run: |
          sudo apt-get install -y lftp
          mkdir -p logs
          # SFTP-Verbindung (Port 22) – identisches Protokoll wie Deploy
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} -p 22 sftp://${{ secrets.FTP_HOST }};
            echo '=== Root-Verzeichnis ===';
            ls /;
            echo '=== Suche nach logs ===';
            ls /logs/ 2>/dev/null || echo '/logs/ nicht gefunden';
            ls logs/ 2>/dev/null || echo 'logs/ nicht gefunden';
            echo '=== Mirror starten ===';
            mirror --verbose /logs ./logs 2>/dev/null || mirror --verbose logs ./logs 2>/dev/null || echo 'Kein logs-Verzeichnis gefunden';
          " || echo "⚠️ SFTP download failed, continuing with local data"

          echo "📁 Log-Verzeichnis:"
          ls -la logs/ || echo "Verzeichnis ist leer"

          # IONOS-Logs sind .gz-komprimiert – entpacken
          if ls logs/*.gz 1> /dev/null 2>&1; then
            echo "📦 Entpacke $(ls logs/*.gz | wc -l) Log-Dateien..."
            gunzip -f logs/*.gz
            echo "📁 Nach Entpacken:"
            ls -la logs/
          else
            echo "ℹ️ Keine .gz-Dateien gefunden"
          fi

      - name: Run Log Analysis (--parse)
        run: node scripts/analyze-logs.mjs --parse
        env:
          LOG_DIR: ./logs
          NODE_ENV: production

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot-stats.json
          # Wir committen nur, wenn sich etwas geändert hat
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update bot stats from logs [skip ci]" && git push)
