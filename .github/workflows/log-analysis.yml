name: Daily Log Analysis

on:
  schedule:
    - cron: '0 16 * * *' # Täglich um 18:00 Uhr (16:00 UTC)
  workflow_dispatch: # Manuelles Auslösen

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download Logs from IONOS
        timeout-minutes: 5
        run: |
          sudo apt-get install -y lftp
          mkdir -p logs
          # Explicit FTPS (Port 21 + StartTLS) – IONOS Standard
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }};
            ls /logs/ || echo 'Verzeichnis /logs/ nicht gefunden';
            mirror --use-cache --verbose /logs ./logs;
          " || echo "⚠️ FTP download failed or timed out, continuing with local data"

          # IONOS-Logs sind .gz-komprimiert – entpacken
          if ls logs/*.gz 1> /dev/null 2>&1; then
            echo "📦 Entpacke $(ls logs/*.gz | wc -l) Log-Dateien..."
            gunzip -f logs/*.gz
          else
            echo "ℹ️ Keine .gz-Dateien gefunden"
          fi
          echo "📁 Log-Verzeichnis:"
          ls -la logs/ || echo "Verzeichnis ist leer"

      - name: Run Log Analysis (--parse)
        run: node scripts/analyze-logs.mjs --parse
        env:
          LOG_DIR: ./logs
          NODE_ENV: production

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot-stats.json
          # Wir committen nur, wenn sich etwas geändert hat
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update bot stats from logs [skip ci]" && git push)
