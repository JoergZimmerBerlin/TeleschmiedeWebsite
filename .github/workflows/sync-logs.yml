name: Sync IONOS Bot Logs
on:
  workflow_dispatch: # Manual trigger from GitHub UI
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  push:
    paths:
      - '.github/workflows/sync-logs.yml'
      - '.trigger-sync'

concurrency:
  group: sync-ionos-logs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-logs:
    name: Fetch & Analyze IONOS Logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download Logs from IONOS via SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p logs-cache
          echo "## 📡 IONOS SFTP Log Discovery & Sync Report" >> $GITHUB_STEP_SUMMARY

          cat << EOF > probe.lftp
          set sftp:auto-confirm yes
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" sftp://$FTP_HOST
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== DIRECTORY LISTING ==="
          ls -la
          echo "=== PARENT LISTING ==="
          ls -la ..
          echo "=== CHECKING /logs ==="
          ls -la /logs
          echo "=== CHECKING logs ==="
          ls -la logs
          echo "=== CHECKING ../logs ==="
          ls -la ../logs
          bye
          EOF

          echo "🔍 Probing IONOS remote directories..."
          lftp -f probe.lftp > sync-diagnosis.txt 2>&1 || true

          echo "### 1. Remote Directory Inspection" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sync-diagnosis.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          cat << EOF > mirror.lftp
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" sftp://$FTP_HOST
          mirror --verbose=2 --only-newer --include-glob='access.log*' /logs ./logs-cache/
          mirror --verbose=2 --only-newer --include-glob='access.log*' logs ./logs-cache/
          mirror --verbose=2 --only-newer --include-glob='access.log*' ../logs ./logs-cache/
          bye
          EOF

          echo "📥 Mirroring logs from IONOS..."
          lftp -f mirror.lftp >> sync-diagnosis.txt 2>&1 || true

          echo "### 2. Downloaded Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la logs-cache/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Sync Diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnosis
          path: |
            sync-diagnosis.txt
            logs-cache/

      - name: Analyze Logs and Update Bot Stats
        run: |
          echo "### 4. 2026 AI/GEO Log Analysis" >> $GITHUB_STEP_SUMMARY
          if [ "$(ls -A logs-cache 2>/dev/null)" ]; then
            echo "✅ Logs successfully downloaded. Starting 2026 AI/GEO Log Analysis..."
            ANALYSIS_OUTPUT=$(LOG_DIR="./logs-cache" node scripts/analyze-logs.mjs --generate 2>&1)
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ANALYSIS_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No log files found in logs-cache." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push Updated Bot Stats & Diagnosis
        run: |
          echo "### 5. Git Commit & Push" >> $GITHUB_STEP_SUMMARY
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Bot Logs)"
          git add data/bot-stats.json sync-diagnosis.txt
          if ! git diff --quiet HEAD data/bot-stats.json sync-diagnosis.txt; then
            echo "📈 New bot traffic or diagnosis data detected. Committing changes..."
            git commit -m "chore(logs): update bot-stats.json and diagnosis [skip ci]"
            git push origin main
            echo "✅ Successfully committed and pushed to main!" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to bot-stats.json or diagnosis." >> $GITHUB_STEP_SUMMARY
          fi
