name: Sync IONOS Bot Logs
on:
  workflow_dispatch: # Manual trigger from GitHub UI
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  push:
    paths:
      - '.github/workflows/sync-logs.yml'
      - '.trigger-sync'

concurrency:
  group: sync-ionos-logs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-logs:
    name: Fetch & Analyze IONOS Logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download Logs from IONOS via SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p logs-cache
          echo "📡 Connecting to IONOS SFTP server to locate access logs..."

          run_lftp_cmd() {
            lftp -u "$FTP_USER","$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:timeout 25; set net:max-retries 2; $1; bye" "sftp://$FTP_HOST"
          }

          echo "📂 Step 1: Remote directory inspection..."
          run_lftp_cmd "pwd; echo 'Root contents:'; ls -la" || true

          echo "📥 Step 2: Attempting mirror from /logs..."
          run_lftp_cmd "mirror --verbose=2 --only-newer --include-glob='access.log*' /logs ./logs-cache" || true

          if [ -z "$(ls -A logs-cache 2>/dev/null)" ]; then
            echo "📥 Step 3: Attempting mirror from relative logs..."
            run_lftp_cmd "mirror --verbose=2 --only-newer --include-glob='access.log*' logs ./logs-cache" || true
          fi

          if [ -z "$(ls -A logs-cache 2>/dev/null)" ]; then
            echo "📥 Step 4: Attempting mirror from parent ../logs..."
            run_lftp_cmd "mirror --verbose=2 --only-newer --include-glob='access.log*' ../logs ./logs-cache" || true
          fi

          echo "📊 Downloaded files in logs-cache:"
          ls -la logs-cache/

      - name: Analyze Logs and Update Bot Stats
        run: |
          if [ "$(ls -A logs-cache 2>/dev/null)" ]; then
            echo "✅ Logs successfully downloaded. Starting 2026 AI/GEO Log Analysis..."
            LOG_DIR="./logs-cache" node scripts/analyze-logs.mjs --generate
          else
            echo "ℹ️ No log files found in logs-cache. Either /logs is restricted or not accessible."
          fi

      - name: Commit and Push Updated Bot Stats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Bot Logs)"
          git add data/bot-stats.json
          if ! git diff --quiet data/bot-stats.json; then
            echo "📈 New bot traffic data detected. Committing changes..."
            git commit -m "chore(logs): update bot-stats.json from IONOS webserver"
            git push origin main
          else
            echo "ℹ️ No changes to bot-stats.json."
          fi
