<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Clean dark background -->
  <rect width="32" height="32" rx="8" fill="#1A1A1A"/>
  
  <!-- The Lüfterrad (Fan) element mirrored from the logo -->
  <g transform="translate(11, 16)">
    <circle r="1.5" fill="#D4FF00"/>
    <g stroke="#D4FF00" stroke-width="1.2" stroke-linecap="round">
      <line y1="-3" y2="-7" />
      <line y1="-3" y2="-7" transform="rotate(45)" />
      <line y1="-3" y2="-7" transform="rotate(90)" />
      <line y1="-3" y2="-7" transform="rotate(135)" />
      <line y1="-3" y2="-7" transform="rotate(180)" />
      <line y1="-3" y2="-7" transform="rotate(225)" />
      <line y1="-3" y2="-7" transform="rotate(270)" />
      <line y1="-3" y2="-7" transform="rotate(315)" />
    </g>
  </g>
  
  <!-- The 'T' character in brand font style -->
  <text x="18" y="21" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">T</text>
  
  <!-- The Lime Dot -->
  <circle cx="27" cy="21" r="2" fill="#D4FF00" />
</svg>
