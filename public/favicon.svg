<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Premium Dark Background -->
  <rect width="32" height="32" rx="7" fill="#1A1A1A"/>
  
  <!-- The Lüfterrad (Fan Wheel) - Faithfully reproduced from user image -->
  <g transform="translate(16, 16)">
    <!-- Central Hub -->
    <circle r="1.5" fill="#D4FF00"/>
    
    <!-- 24 Radiating Spokes -->
    <g stroke="#D4FF00" stroke-width="1.6" stroke-linecap="round">
      <line y1="-4" y2="-12" transform="rotate(0)" />
      <line y1="-4" y2="-12" transform="rotate(15)" />
      <line y1="-4" y2="-12" transform="rotate(30)" />
      <line y1="-4" y2="-12" transform="rotate(45)" />
      <line y1="-4" y2="-12" transform="rotate(60)" />
      <line y1="-4" y2="-12" transform="rotate(75)" />
      <line y1="-4" y2="-12" transform="rotate(90)" />
      <line y1="-4" y2="-12" transform="rotate(105)" />
      <line y1="-4" y2="-12" transform="rotate(120)" />
      <line y1="-4" y2="-12" transform="rotate(135)" />
      <line y1="-4" y2="-12" transform="rotate(150)" />
      <line y1="-4" y2="-12" transform="rotate(165)" />
      <line y1="-4" y2="-12" transform="rotate(180)" />
      <line y1="-4" y2="-12" transform="rotate(195)" />
      <line y1="-4" y2="-12" transform="rotate(210)" />
      <line y1="-4" y2="-12" transform="rotate(225)" />
      <line y1="-4" y2="-12" transform="rotate(240)" />
      <line y1="-4" y2="-12" transform="rotate(255)" />
      <line y1="-4" y2="-12" transform="rotate(270)" />
      <line y1="-4" y2="-12" transform="rotate(285)" />
      <line y1="-4" y2="-12" transform="rotate(300)" />
      <line y1="-4" y2="-12" transform="rotate(315)" />
      <line y1="-4" y2="-12" transform="rotate(330)" />
      <line y1="-4" y2="-12" transform="rotate(345)" />
    </g>
  </g>
</svg>
