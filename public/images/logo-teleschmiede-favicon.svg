<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .spoke { stroke: #1A1A1A; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #D4FF00; }
    </style>
  </defs>
  <g transform="translate(16, 16)">
    <circle r="2.5" fill="#1A1A1A"/>
    <g id="spokes">
      <line class="spoke" y1="-5" y2="-13" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(30)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(60)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(90)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(120)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(150)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(180)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(210)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(240)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(270)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(300)" />
      <line class="spoke" y1="-5" y2="-13" transform="rotate(330)" />
    </g>
  </g>
  <!-- Minimalist brand dot representation -->
  <circle class="dot" cx="26" cy="26" r="4" />
</svg>
